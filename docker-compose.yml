# Workforce-VMS — Datadog Code Security demo
# Single-command bring-up:  cp .env.example .env  → add DD_API_KEY → docker compose up
#
# Three services: the vulnerable app (under dd-java-agent), PostgreSQL, and the
# Datadog Agent. All Code Security runtime surfaces (IAST, runtime SCA, App & API
# Protection) are toggled via env vars on the `app` service so they are easy to show.

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Source Code Integration — link findings to file/line/PR.
        DD_GIT_REPOSITORY_URL: ${DD_GIT_REPOSITORY_URL:-}
        DD_GIT_COMMIT_SHA: ${DD_GIT_COMMIT_SHA:-}
    image: workforce-vms:latest
    depends_on:
      postgres:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: workforce
      DB_USER: workforce
      DB_PASSWORD: workforce

      # ── APM / Unified Service Tagging ─────────────────────────────────────
      DD_ENV: ${DD_ENV:-magnit-demo}
      DD_SERVICE: ${DD_SERVICE:-workforce-vms}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_TRACE_ENABLED: "true"
      DD_TRACE_SAMPLE_RATE: "1"          # capture every trace for the demo
      DD_LOGS_INJECTION: "true"

      # ── Code Security runtime surfaces ────────────────────────────────────
      DD_IAST_ENABLED: "true"            # IAST: tainted input → sink, with file/line
      DD_APPSEC_ENABLED: "true"          # App & API Protection (threat detection + blocking)
      DD_APPSEC_SCA_ENABLED: "true"      # Runtime SCA: confirm vulnerable libs load + execute

      # Source Code Integration (also embedded at build time)
      DD_GIT_REPOSITORY_URL: ${DD_GIT_REPOSITORY_URL:-}
      DD_GIT_COMMIT_SHA: ${DD_GIT_COMMIT_SHA:-}

      # ── NON-UPGRADE MITIGATING CONTROL (Log4Shell) — commented OFF by default ──
      # Uncomment to neutralize CVE-2021-44228 WITHOUT upgrading log4j (see MITIGATION.md).
      # LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: workforce
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce -d workforce"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY:?set DD_API_KEY in .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"   # accept traces from the app container
      DD_APM_RECEIVER_PORT: "8126"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
    ports:
      - "8126:8126"     # APM trace intake (also carries AAP/IAST/SCA telemetry)
      - "8125:8125/udp" # DogStatsD
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

volumes:
  pgdata:
