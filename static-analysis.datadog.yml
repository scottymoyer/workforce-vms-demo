# Datadog Static Analysis (SAST) — LEGACY config format (flat `rulesets:`).
#
# Kept because the spec/older tooling references this filename. The current
# `code-security.datadog.yaml` (nested under `sast:`) takes precedence if present.
# Rulesets are identical so IDE + CI + PR findings stay consistent either way.
#
# Docs: https://docs.datadoghq.com/security/code_security/static_analysis/

rulesets:
  - java-security
  - java-best-practices
  - java-code-style
  - java-inclusive
